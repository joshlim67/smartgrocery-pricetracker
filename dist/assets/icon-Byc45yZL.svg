<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="neonEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle glass shine layer -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>
  <ellipse cx="256" cy="120" rx="180" ry="70" fill="rgba(255,255,255,0.06)"/>

  <!-- Trolley Cart Body -->
  <g filter="url(#glow)">
    <path d="M120 140 H160 L200 320 H370 L400 190 H180" fill="none" stroke="url(#neonEmerald)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Cart Grid Lines -->
    <path d="M240 200 L230 310" stroke="url(#neonEmerald)" stroke-width="12" stroke-linecap="round" opacity="0.7"/>
    <path d="M300 200 L290 310" stroke="url(#neonEmerald)" stroke-width="12" stroke-linecap="round" opacity="0.7"/>
    <path d="M360 200 L350 310" stroke="url(#neonEmerald)" stroke-width="12" stroke-linecap="round" opacity="0.7"/>
    <path d="M190 260 H380" stroke="url(#neonEmerald)" stroke-width="12" stroke-linecap="round" opacity="0.7"/>
    <!-- Wheels -->
    <circle cx="210" cy="380" r="28" fill="#10b981" stroke="#34d399" stroke-width="8"/>
    <circle cx="360" cy="380" r="28" fill="#10b981" stroke="#34d399" stroke-width="8"/>
  </g>

  <!-- Safety Shield / Shield Lock badge overlay -->
  <g transform="translate(320, 100) scale(0.9)" filter="url(#glow)">
    <circle cx="60" cy="60" r="54" fill="#0f172a" stroke="url(#neonCyan)" stroke-width="8"/>
    <!-- Percent / Savings Spark -->
    <path d="M45 45 L75 75 M45 75 L75 45" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
    <circle cx="45" cy="45" r="5" fill="#38bdf8"/>
    <circle cx="75" cy="75" r="5" fill="#38bdf8"/>
  </g>
</svg>
